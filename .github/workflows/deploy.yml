name: Verify Cloudflare deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/prepare-cloudflare-assets.mjs
      - run: npx wrangler deploy --dry-run
# Live deployment runs through scripts/deploy-cloudflare.mjs on the publisher
# host so every deployment restores the episode catalog from R2.
