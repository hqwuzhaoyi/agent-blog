name: Verify Cloudflare deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy --config dist-react/server/wrangler.json --dry-run
# Live application deployment uses scripts/deploy-cloudflare.mjs.
# Content publication uses the authenticated Worker API independently of CI.
